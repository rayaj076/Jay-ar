<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Letter by Letter Animation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f0f0f0;
    }

    /* Wrapper */
    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    /* NAV BAR */
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #333;
        padding: 15px;
        border-radius: 10px;
        color: white;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        font-size: 18px;
    }

    /* Responsive navigation */
    @media (max-width: 600px) {
        nav {
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }
        nav a {
            font-size: 16px;
        }
    }

    /* LETTER BY LETTER TEXT */
    .animated-text {
        display: inline-block;
        font-size: 32px;
        font-weight: bold;
        margin-top: 30px;
        white-space: nowrap;
        overflow: hidden;
        border-right: 3px solid black;
        animation: caret 0.7s infinite;
    }

    @keyframes caret {
        50% { border-color: transparent; }
    }

    /* Responsive text size */
    @media (max-width: 600px) {
        .animated-text {
            font-size: 24px;
        }
    }

</style>
</head>
<body>

<div class="container">

    <nav>
