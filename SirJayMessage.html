<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Letter by Letter Animation</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f0f0f0;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 20px;
        text-align: center; /* FULL CENTERING */
    }

    /* NAV BAR */
    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #333;
        padding: 15px;
        border-radius: 10px;
        color: white;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        font-size: 18px;
    }

    /* Mobile nav fixes */
    @media (max-width: 600px) {
        nav {
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }
        nav a {
            font-size: 16px;
            margin-left: 0;
        }
    }

    /* LETTER BY LETTER TEXT */
    .animated-text {
        display: inline-block;
        font-size: 32px;
        font-weight: bold;
        margin-top: 30px;
        white-space: nowrap;
        overflow: hidden;
        border-right: 3px solid black;
        animation: caret 0.7s infinite;
        text-align: center;
    }

    @keyframes caret {
        50% { border-color: transparent; }
    }

    /* Mobile font adjustment */
    @media (max-width: 600px) {
        .animated-text {
            font-size: 26px;
        }
    }
</style>
</head>
<body>

<div class="container">

    <nav>
        <div class="logo">My Website</div>
        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Gallery</a>
        </div>
    </nav>

    <!-- TEXT IS NOW 100% CENTERED -->
    <h2 class="animated-text" id="text"></h2>

</div>

<script>
/* LETTER BY LETTER EFFECT */
const text = "~Sir Jay";
let index = 0;

function typeLetter() {
    document.getElementById("text").textContent = text.substring(0, index);
    index++;
    if (index <= text.length) {
        setTimeout(typeLetter, 80);
    }
}

typeLetter();
</script>

</body>
</html>
